<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RASPADINHA PREMIADA BLOWTEX</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>

body{
font-family:Arial;
text-align:center;
background:linear-gradient(180deg,#ffffff,#f6f6f6);
color:black;
margin:0;
overflow-x:hidden;
}

/* FUNDO */

body::before{
content:"BLOWTEX BLOWTEX BLOWTEX BLOWTEX BLOWTEX BLOWTEX BLOWTEX";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
font-family:Georgia, serif;
font-weight:bold;
font-size:140px;
color:#f5a623;
-webkit-text-stroke:2px black;
opacity:0.10;
display:flex;
flex-wrap:wrap;
align-content:center;
justify-content:center;
line-height:180px;
transform:rotate(-20deg);
pointer-events:none;
}

/* TITULO */

.titulo{
font-family:Georgia, serif;
font-size:70px;
font-weight:bold;
color:#f5a623;
-webkit-text-stroke:3px black;
text-shadow:
2px 2px 0 #000,
4px 4px 0 rgba(0,0,0,0.4);
letter-spacing:2px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(6,90px);
gap:15px;
justify-content:center;
margin-top:30px;
position:relative;
z-index:10;
}

/* CARTÃO */

.card{
position:relative;
width:90px;
height:90px;
background:linear-gradient(145deg,#f5a623,#c98200);
border:3px solid #f5a623;
border-radius:10px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,0.35);
z-index:20;
}

/* PRÊMIO */

.prize{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:22px;
font-weight:bold;
color:black;
z-index:1;
}

/* CANVAS */

canvas{
position:absolute;
top:0;
left:0;
touch-action:none;
z-index:2;
}

/* FORM */

.form-container{
display:none;
margin-top:30px;
background:white;
padding:20px;
width:300px;
margin-left:auto;
margin-right:auto;
border-radius:12px;
border:2px solid #f5a623;
box-shadow:0 0 15px rgba(245,166,35,0.7);
}

input{
width:90%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
background:#f5a623;
color:white;
border:none;
padding:12px 25px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

/* TELA PREMIO */

#premioAnimacao{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

/* CAIXA */

.premioBox{
background:#111;
padding:60px;
border-radius:25px;
border:3px solid #f5a623;

box-shadow:
0 0 20px #f5a623,
0 0 50px rgba(245,166,35,0.8);
}

/* PARABENS */

.premioBox h2{
font-family:Georgia, serif;
font-size:42px;
color:#f5a623;
}

/* VALOR */

#valorPremio{
font-size:75px;
font-weight:bold;
color:#f5a623;

text-shadow:
0 0 10px #f5a623,
0 0 40px rgba(245,166,35,0.8);
}

</style>

</head>

<body>

<h1 class="titulo">Raspadinha Premiada Blowtex</h1>
<p>Escolha um cartão e raspe</p>

<div class="grid" id="grid"></div>

<div class="form-container" id="formContainer">

<h3>Cadastro</h3>

<input type="text" id="nome" placeholder="Nome">
<input type="text" id="cpf" placeholder="CPF">
<input type="text" id="vendedor" placeholder="Código vendedor">
<input type="text" id="valor" readonly>

<br><br>

<button onclick="enviarDados()">Enviar</button>

</div>

<div id="premioAnimacao">

<div class="premioBox">

<h2>PARABÉNS</h2>

<div id="valorPremio"></div>

<button onclick="fecharPremio()">Continuar</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

const grid=document.getElementById("grid");
const formContainer=document.getElementById("formContainer");
const valorInput=document.getElementById("valor");

let prizes=[];
let jaEscolheu=false;

/* PRÊMIOS */

function generatePrizes(){

prizes=[
100,100,
70,70,
50,50,50,50,50,50,
30,30,30,30,30,
30,30,30,30,30,
30,30,30,30,30,
30,30,30,30,30
];

for(let i=prizes.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[prizes[i],prizes[j]]=[prizes[j],prizes[i]];
}

}

/* CARTÕES */

function createCards(){

for(let i=0;i<30;i++){

let card=document.createElement("div");
card.classList.add("card");

let prize=document.createElement("div");
prize.classList.add("prize");
prize.innerText="R$"+prizes[i];

let canvas=document.createElement("canvas");
canvas.width=90;
canvas.height=90;

let ctx=canvas.getContext("2d");

ctx.fillStyle="#f5a623";
ctx.fillRect(0,0,90,90);

ctx.fillStyle="white";
ctx.font="bold 26px Arial";
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillText(i+1,45,45);

card.appendChild(prize);
card.appendChild(canvas);

let raspando=false;
let raspado=0;

function raspar(x,y){

ctx.globalCompositeOperation="destination-out";

ctx.beginPath();
ctx.arc(x,y,15,0,Math.PI*2);
ctx.fill();

raspado++;

if(raspado>40 && !jaEscolheu){
mostrarPremio(prizes[i]);
}

}

/* MOUSE */

canvas.addEventListener("mousedown",()=>{raspando=true});
canvas.addEventListener("mouseup",()=>raspando=false);

canvas.addEventListener("mousemove",(e)=>{

if(!raspando||jaEscolheu)return;

let rect=canvas.getBoundingClientRect();

raspar(
e.clientX-rect.left,
e.clientY-rect.top
);

});

/* CELULAR / IOS */

canvas.addEventListener("touchstart",(e)=>{
raspando=true;
});

canvas.addEventListener("touchend",()=>{
raspando=false;
});

canvas.addEventListener("touchmove",(e)=>{

e.preventDefault();

if(!raspando||jaEscolheu)return;

let rect=canvas.getBoundingClientRect();

let touch=e.touches[0];

raspar(
touch.clientX-rect.left,
touch.clientY-rect.top
);

},{passive:false});

grid.appendChild(card);

}

}

/* MOSTRAR PRÊMIO */

function mostrarPremio(valor){

jaEscolheu=true;

valorInput.value=valor;

document.getElementById("valorPremio").innerText="R$"+valor;

document.getElementById("premioAnimacao").style.display="flex";

confetti({
particleCount:300,
spread:160
});

}

/* FECHAR */

function fecharPremio(){

document.getElementById("premioAnimacao").style.display="none";

formContainer.style.display="block";

}

/* ENVIO */

function enviarDados(){

let nome=document.getElementById("nome").value;
let cpf=document.getElementById("cpf").value;
let vendedor=document.getElementById("vendedor").value;
let valor=document.getElementById("valor").value;

cpf=cpf.replace(/\D/g,"");

let hoje=new Date().toLocaleDateString();

let registro=localStorage.getItem("cpf_"+cpf);

if(registro===hoje){
alert("CPF já participou hoje");
return;
}

const url="https://docs.google.com/forms/d/e/1FAIpQLSd3STV7i88X8EfeeIRps3-ApGjbpnZL1NP50zUJAIjFprZr8w/formResponse";

const formData=new FormData();

formData.append("entry.1662973908",nome);
formData.append("entry.894594532",cpf);
formData.append("entry.1816501979",vendedor);
formData.append("entry.785238394",valor);

fetch(url,{
method:"POST",
mode:"no-cors",
body:formData
}).then(()=>{

localStorage.setItem("cpf_"+cpf,hoje);

alert("Cadastro enviado");

formContainer.style.display="none";

});

}

generatePrizes();
createCards();

</script>

</body>
</html>
